
[include mainsail.cfg]
[include macro.cfg]
[include skr_e3_v3.cfg]
[include ebb36_gen2.cfg]

# ============================================================
# Probe offset
# ============================================================
#_offset: 32.475
#_offset: -12.468

# ============================================================
# RPI
# ============================================================
[temperature_sensor raspberry_pi]
sensor_type: temperature_host

# ============================================================
# Base settuings
# ============================================================
[printer]
kinematics: corexy
max_velocity: 300
max_accel: 3000
max_z_velocity: 20
max_z_accel: 100

[safe_z_home]
home_xy_position: 117.5, 117.5
speed: 50
z_hop: 10
z_hop_speed: 25

    
# ============================================================
# Dual Z tilt (stepper_z left, stepper_z1 right)
# ============================================================
# z_positions are nozzle XY of each leadscrew (can be outside the bed).
# points are nozzle XY; probe must still be over the bed (x_offset 32.475).
[z_tilt]
z_positions:
    0, 117.5
    235, 117.5
points:
    40, 117.5
    195, 117.5
speed: 120
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.01

# ============================================================
# Manual Bed adjust tilt_adjus
# ============================================================

#screw positions
#screw1: 35,35
#screw2: 200,35
#screw3: 35,200
#screw4: 200,200

[screws_tilt_adjust]
screw1: 35,35
screw1_name: hinten links

screw2: 200,35
screw2_name: vorne links

screw3: 35,200
screw3_name: vorne rechts

screw4: 200,200
screw4_name: hinten rechts

horizontal_move_z: 10
speed: 120
screw_thread: CW-M3


# ============================================================
# Bedmesh
# ============================================================
[bed_mesh]
algorithm: bicubic
speed: 75
horizontal_move_z: 10
mesh_min: 0, 0
mesh_max: 205, 220		#adjust after after changing offset  meshmax + offset muss under y/x max liegen 
probe_count: 8, 8
#probe_count: 16, 16
fade_start: 1.0
fade_end: 10.0
fade_target: 0

[delayed_gcode my_delayed_gcode]
initial_duration: 1.0
gcode:
    BED_MESH_PROFILE LOAD="default"


