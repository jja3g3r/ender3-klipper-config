
[include mainsail.cfg]
[include macro.cfg]
[include skr_e3_v3.cfg]
[include ebb36_gen2.cfg]

# ============================================================
# Probe offset
# ============================================================
#x_offset: 32.475
#y_offset: -12.468

# ============================================================
# RPI
# ============================================================
[temperature_sensor raspberry_pi]
sensor_type: temperature_host

# ============================================================
# Base settuings
# ============================================================
[printer]
kinematics: corexy
max_velocity: 300
max_accel: 5000
max_z_velocity: 40
max_z_accel: 100

[safe_z_home]
home_xy_position: 85.025, 129.968  #117.5, 117.5 - offset
speed: 75
z_hop: 10                 
z_hop_speed:50

    
# ============================================================
# Dual Z tilt (stepper_z left, stepper_z1 right)
# ============================================================
# z_positions are nozzle XY of each leadscrew (can be outside the bed).
# points are nozzle XY; probe must still be over the bed (x_offset 32.475).
[z_tilt]
z_positions:
    0, 117.5
    235, 117.5
points:
    7.525, 129.968 # 40, 117.5 - offset
    162.525, 129.968 # 195, 117.5 - offset
speed: 50
horizontal_move_z: 10
retries: 3
retry_tolerance: 0.01

# ============================================================
# Manual Bed adjust tilt_adjus
# ============================================================

#screw positions
#screw1: 35,35 - offset
#screw2: 200,35 - offset
#screw3: 35,200 - offset
#screw4: 200,200 - offset

[screws_tilt_adjust]

screw1: 2.525, 47.468
screw1_name: hinten links

screw2: 167.525, 47.468
screw2_name: vorne links

screw3: 2.525, 212.468
screw3_name: vorne rechts

screw4: 167.525, 212.468
screw4_name: hinten rechts

horizontal_move_z: 10
speed: 120
screw_thread: CW-M3

# ============================================================
# Input shaper
# ============================================================

[resonance_tester]
accel_chip: lis2dw
probe_points:
    117.5,117.5,20

[input_shaper]
#shaper_type_x: mzv
#shaper_type_y: mzv
# ============================================================
# Bedmesh
# ============================================================
[bed_mesh]
algorithm: bicubic
speed: 150
horizontal_move_z: 10
mesh_min: 33, 2
mesh_max: 230, 226		#adjust after after changing offset  meshmax + offset muss under y/x max liegen 
probe_count: 8, 8
#probe_count: 16, 16
fade_start: 1.0
fade_end: 10.0
fade_target: 0

[delayed_gcode my_delayed_gcode]
initial_duration: 1.0
gcode:
    BED_MESH_PROFILE LOAD="default"

