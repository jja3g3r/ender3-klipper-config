# This file contains common pin mappings for the BIGTREETECH EBB36
# GEN2 board. To use this config, the firmware should be compiled for the
# STM32G0B1 with “8 MHz crystal” and “USB (on PA11/PA12)” or “CAN bus (on PB12/PB13)”.
# The “EBB36 GEN2” micro-controller will be used to control the components on the nozzle.
# See docs/Config_Reference.md for a description of parameters.

[mcu EBB] 
serial:/dev/serial/by-id/usb-Klipper_stm32g0b1xx_EBB36_GEN-if00

# ============================================================
# EBB TEMPERATURE
# ============================================================
[temperature_sensor EBB36] 
sensor_type: Generic 3950 
sensor_pin:  EBB:PA0
pullup_resistor: 2200

# ============================================================
# ACCELEROMETER
# ============================================================
[lis2dw]
cs_pin: EBB:PB1
spi_bus: spi2_PB2_PB11_PB10
axes_map: x,y,z

# ============================================================
# EXTRUDER
# ============================================================

[extruder]
step_pin: EBB:PB14
dir_pin: EBB:PA8
enable_pin: !EBB:PB6
microsteps: 16
rotation_distance: 33.500

nozzle_diameter: 0.400
filament_diameter: 1.750

heater_pin: EBB:PB4
sensor_type: EPCOS 100K B57560G104F
pullup_resistor: 2200
sensor_pin: EBB:PA3

control: pid
pid_Kp: 26.326
pid_Ki: 1.310
pid_Kd: 132.286

min_temp: 0
max_temp: 250

# ============================================================
# Fans
# ============================================================

# Part cooling fan 1
[fan]
pin: EBB:PD3

# Part cooling fan 2
[fan_generic part_cooling_fan_2]
pin: EBB:PA5

# Hotend cooling fan
[heater_fan hotend_fan]
pin: EBB:PD2
heater: extruder
heater_temp: 50.0

# ============================================================
# Biqu sensor
# ============================================================
[gcode_macro PROBE_DOWN]
gcode:
    SET_PIN PIN=probe_enable VALUE=1

[gcode_macro PROBE_UP]
gcode:
    SET_PIN PIN=probe_enable VALUE=0

[probe]
pin: ^!EBB:PB8
deactivate_on_each_sample: False
x_offset: 32.475
y_offset: -12.468
z_offset:0
samples: 2
samples_tolerance: 0.05
samples_tolerance_retries: 3
activate_gcode:
    PROBE_DOWN
    G4 P500
deactivate_gcode:
    PROBE_UP

