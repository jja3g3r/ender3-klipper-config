# SKR Mini E3 V3 sockets:
#   X  -> CoreXY A   (stepper_x)
#   Y  -> CoreXY B   (stepper_y)
#   Z  -> Z left     (stepper_z)
#   E  -> Z right    (stepper_z1)
# Extruder motor is on the EBB36, not the SKR E socket.

# ============================================================
# SKR X  ->  COREXY MOTOR A
# ============================================================

[stepper_x]
step_pin: PB13
dir_pin: PB12
enable_pin: !PB14
microsteps: 16
rotation_distance: 40
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_min: 2
position_max: 250
position_endstop: 2
homing_speed: 50
homing_retract_dist: 0

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
uart_address: 0
run_current: 0.580
stealthchop_threshold: 0
diag_pin: ^PC0
driver_SGTHRS: 100

# ============================================================
# SKR Y  ->  COREXY MOTOR B
# ============================================================

[stepper_y]
step_pin: PB10
dir_pin: PB2
enable_pin: !PB11
microsteps: 16
rotation_distance: 40
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_min: -11
position_max: 230
position_endstop: -11
homing_speed: 50
homing_retract_dist: 0

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
uart_address: 2
run_current: 0.580
stealthchop_threshold: 0
diag_pin: ^PC1
driver_SGTHRS: 100

# ============================================================
# SKR Z  ->  Z MOTOR LEFT (stepper_z)
# ============================================================

[stepper_z]
step_pin: PB0
dir_pin: PC5
enable_pin: !PB1
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_min: -20
position_max: 245

[tmc2209 stepper_z]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
run_current: 0.580
stealthchop_threshold: 999999

# ============================================================
# SKR E  ->  Z MOTOR RIGHT (stepper_z1)
# ============================================================

[stepper_z1]
step_pin: PB3
dir_pin: !PB4
enable_pin: !PD1
microsteps: 16
rotation_distance: 8

[tmc2209 stepper_z1]
uart_pin: PC11
tx_pin: PC10
uart_address: 3
run_current: 0.580
stealthchop_threshold: 999999

# ============================================================
# HEATED BED
# ============================================================
[heater_bed]
heater_pin: PC9
sensor_type: ATC Semitec 104GT-2
sensor_pin: PC4
control: pid
pid_Kp: 71.913
pid_Ki: 1.522
pid_Kd: 849.467
min_temp: 0
max_temp: 110

# ============================================================
# DISPLAY
# ============================================================

[display]
lcd_type: st7920
cs_pin: EXP1_7
sclk_pin: EXP1_6
sid_pin: EXP1_8
encoder_pins: ^EXP1_5, ^EXP1_3
click_pin: ^!EXP1_2

[output_pin beeper]
pin: EXP1_1

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PB5,  EXP1_3=PA9,  EXP1_5=PA10, EXP1_7=PB8,  EXP1_9=<GND>,
    EXP1_2=PA15, EXP1_4=<RST>, EXP1_6=PB9,  EXP1_8=PD6,  EXP1_10=<5V>

# ============================================================
# ENCLOSURE FANS - SKR E3 V3
# ============================================================

[controller_fan enclosure_fan_1]
pin: PC6
idle_timeout: 60

[controller_fan enclosure_fan_2]
pin: PC7
idle_timeout: 60

[controller_fan enclosure_fan_3]
pin: PB15
idle_timeout: 60

# ============================================================
# More
# ============================================================

[mcu]
serial: /dev/ttyAMA0
restart_method: command
#serial: /dev/serial/by-id/usb-Klipper_stm32f103xe_35FFD6054246303221630757-if00 // for usb connection

[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
