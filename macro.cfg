[gcode_macro CALCULATE_TILT]
description: Run screws tilt calculate
gcode:
    
    M140 S60                    ; Set bed temp to 80°C (no wait)
    M190 S60
    G28                   
    SCREWS_TILT_CALCULATE


[gcode_macro PREHEAT_PLA]
description: Preheat the bed to 60°C and nozzle to 200°C for PLA
gcode:
    # Set bed temperature to 60°C
    M140 S60 
    # Set nozzle temperature to 200°C
    M104 S200 
    # Wait for bed temperature to reach 60°C
    #M190 S60 
    # Wait for nozzle temperature to reach 200°C
    #M109 S200

[gcode_macro PREHEAT_PETG]
description: Preheat the bed to 80°C and nozzle to 250°C for PETG
gcode:
    # Set bed temperature to 250°C
    M140 S80
    # Set nozzle temperature to 250 °C
    M104 S250 
    # Wait for bed temperature to reach 80°C
    #M190 S80
    # Wait for nozzle temperature to reach 250°C
    #M109 S250


[gcode_macro BED_PID_TUNE]
description: Automatic bed PID tuning and saving results
gcode:
    # Start PID tuning for the bed at a target temperature of 60°C
    PID_CALIBRATE HEATER=heater_bed TARGET=60
    # Wait for PID tuning to complete
    RESPOND MSG="PID tuning for bed completed, saving results..."
    # Save the PID calibration results
    SAVE_CONFIG
    # Notify the user
    M117 Bed PID tuning complete and saved



[gcode_macro NOZZLE_PID_TUNE]
description: Automatic nozzle PID tuning and saving results
gcode:
    # Start PID tuning for the nozzle at a target temperature of 210°C
    PID_CALIBRATE HEATER=extruder TARGET=210
    # Notify the user that tuning is in progress
    RESPOND MSG="Nozzle PID tuning started at 210°C..."
    # Wait for PID tuning to complete
    RESPOND MSG="Nozzle PID tuning completed, saving results..."
    # Save the PID calibration results
    SAVE_CONFIG
    # Notify the user on the screen
    M117 Nozzle PID tuning complete and saved


[gcode_macro LOAD_DEFAULT_BED_MESH]
description: Load the default bed mesh
gcode:
    # Load the saved bed mesh profile

    BED_MESH_PROFILE LOAD=default
    # Notify the user
    RESPOND MSG="Default bed mesh loaded."
    M117 Default bed mesh loaded

[gcode_macro NEW_BED_MESH_PLA]
description: "Heat bed to 60°C, home, probe mesh, and save mesh"
gcode:
    G28
    M140 S60                    ; Set bed temp to 60°C (no wait)
    M190 S60                    ; Wait for bed to reach 60°C
    G28                         ; Home all axes
    BED_MESH_CLEAR              ; Clear any existing mesh
    BED_MESH_CALIBRATE          ; Probe new mesh
    BED_MESH_PROFILE save=default ; Save mesh as default profile

[gcode_macro NEW_BED_MESH_PETG]
description: "Heat bed to 80°C, home, probe mesh, and save mesh"
gcode:
    G28
    M140 S80                    ; Set bed temp to 80°C (no wait)
    M190 S80                    ; Wait for bed to reach 80°C
    G28                         ; Home all axes
    BED_MESH_CLEAR              ; Clear any existing mesh
    BED_MESH_CALIBRATE          ; Probe new mesh
    BED_MESH_PROFILE save=default ; Save mesh as default profile


[gcode_macro RESTART_KLIPPER]
description: Restart Klipper firmware
gcode:
    RESTART


