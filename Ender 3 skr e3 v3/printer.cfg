
[include mainsail.cfg]
[include macro.cfg]

[stepper_x]
step_pin: PB13
dir_pin: !PB12
enable_pin: !PB14
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC0
position_min: 2
position_max: 250 # above bed size for bltouch and screw tilt adjust
position_endstop: 2
homing_speed: 50

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
uart_address: 0
run_current: 0.580
stealthchop_threshold: 999999

[stepper_y]
step_pin: PB10
dir_pin: !PB2
enable_pin: !PB11
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC1
position_min: -11
position_max: 230 # above bed size for bltouch and screw tilt adjust
position_endstop:-11 
homing_speed: 50

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
uart_address: 2
run_current: 0.580
stealthchop_threshold: 999999

[stepper_z]
step_pin: PB0
dir_pin: PC5
enable_pin: !PB1
microsteps: 16
endstop_pin: probe:z_virtual_endstop
position_min: -20  # Erlaube leichtes Unterschreiten von Z=0, wenn nötig 
rotation_distance: 8
position_max: 245

[tmc2209 stepper_z]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
run_current: 0.580
stealthchop_threshold: 999999

[bltouch]
sensor_pin: ^PC14
control_pin: PA1
samples: 2
speed: 15.0
x_offset: -40.0
y_offset: -6.5
#z_offset: 2.200

[safe_z_home]
home_xy_position: 157.5, 124.0  #117.5, 117.5 default; adjust after after changing offset
speed: 50
z_hop: 10                 
z_hop_speed:25

# working
[bed_mesh]
algorithm: bicubic
speed: 75
horizontal_move_z: 10
mesh_min: 0, 0
mesh_max: 205, 220		#adjust after after changing offset  meshmax + offset muss under y/x max liegen 
probe_count: 8, 8
#probe_count: 16, 16
fade_start: 1.0
fade_end: 10.0
fade_target: 0


[extruder]
step_pin: PB3
dir_pin: !PB4
enable_pin: !PD1
microsteps: 16
rotation_distance: 33.500
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PC8
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA0
#control: pid
#pid_Kp: 21.527
#pid_Ki: 1.063
#pid_Kd: 108.982
min_temp: 0
max_temp: 265

[tmc2209 extruder]
uart_pin: PC11
tx_pin: PC10
uart_address: 3
run_current: 0.650
stealthchop_threshold: 999999

[heater_bed]
heater_pin: PC9
sensor_type: ATC Semitec 104GT-2
sensor_pin: PC4
#control: pid
#pid_Kp: 54.027
#pid_Ki: 0.770
#pid_Kd: 948.182
min_temp: 0
max_temp: 110

[bed_screws]
screw1: 35,35
screw2: 200,35
screw3: 35,200
screw4: 200,200

#x_offset: -36.0
#y_offset: -4
#z_offset: 2.200

[screws_tilt_adjust]
screw1: 75,206.5
screw1_name: hinten links

screw2: 75,41.5
screw2_name: vorne links

screw3: 240,41.5
screw3_name: vorne rechts

screw4: 240,206.5
screw4_name: hinten rechts

horizontal_move_z: 10
speed: 120
screw_thread: CW-M3



[screws_tilt_adjust]
screw1: 75,206.5
screw1_name: hinten links

screw2: 75,41.5
screw2_name: vorne links

screw3: 240,41.5
screw3_name: vorne rechts

screw4: 240,206.5
screw4_name: hinten rechts

horizontal_move_z: 10
speed: 120
screw_thread: CW-M3



#Fan0
[fan]
pin: PC6

#Fan1
[controller_fan electronic_enclosure_fan]
pin: PC7
idle_timeout: 60

#Fan2
[heater_fan hotend_fan]
pin: PB15
heater: extruder
heater_temp: 50.0



[mcu]
serial: /dev/ttyAMA0
restart_method: command
#serial: /dev/serial/by-id/usb-Klipper_stm32f103xe_35FFD6054246303221630757-if00 // for usb connection

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 1500 #3000
max_z_velocity: 5
max_z_accel: 100

[temperature_sensor mcu_temp]
sensor_type: temperature_mcu

[temperature_sensor raspberry_pi]
sensor_type: temperature_host

#[static_digital_output usb_pullup_enable]
#pins: !PA14

[display]
lcd_type: st7920
cs_pin: EXP1_7
sclk_pin: EXP1_6
sid_pin: EXP1_8
encoder_pins: ^EXP1_5, ^EXP1_3
click_pin: ^!EXP1_2

[output_pin beeper]
pin: EXP1_1 

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PB5,  EXP1_3=PA9,  EXP1_5=PA10, EXP1_7=PB8,  EXP1_9=<GND>,
    EXP1_2=PA15, EXP1_4=<RST>, EXP1_6=PB9,  EXP1_8=PD6,  EXP1_10=<5V>

[delayed_gcode my_delayed_gcode]
initial_duration: 1.0
gcode:
    BED_MESH_PROFILE LOAD="default"

